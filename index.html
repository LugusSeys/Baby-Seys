  const xFor = d => padL + (d/maxDay)*innerW;

  // Y-bereik: de volledige band plus de metingen zelf
  let minV = Infinity, maxV = -Infinity;
  for (let d = 0; d <= maxDay; d += step) {
    const lo = whoValue(kind, sex, d, WHO_Z[0].z), hi = whoValue(kind, sex, d, WHO_Z[6].z);
    if (lo !== null) { minV = Math.min(minV, lo); maxV = Math.max(maxV, hi); }
  }
  points.forEach(p => { minV = Math.min(minV, p.value); maxV = Math.max(maxV, p.value); });
  if (!isFinite(minV)) return "";
  const padV = (maxV-minV)*0.04; minV -= padV; maxV += padV;
  const yFor = v => padT + innerH - ((v-minV)/(maxV-minV||1))*innerH;

  // Bandpaden opbouwen
  function linePath(z) {
    let s = "";
    for (let d = 0; d <= maxDay; d += step) {
      const v = whoValue(kind, sex, d, z); if (v === null) continue;
      s += (s ? "L" : "M") + xFor(d).toFixed(1) + " " + yFor(v).toFixed(1);
    }
    return s;
  }
  function bandPath(zLo, zHi) {
    let up = "", down = "";
    for (let d = 0; d <= maxDay; d += step) {
      const a = whoValue(kind, sex, d, zLo), b = whoValue(kind, sex, d, zHi);
      if (a === null) continue;
      up += (up ? "L" : "M") + xFor(d).toFixed(1) + " " + yFor(a).toFixed(1);
      down = "L" + xFor(d).toFixed(1) + " " + yFor(b).toFixed(1) + down;
    }
    return up + down + "Z";
  }

  let bands = "";
  // Buitenste banden licht, naar de mediaan toe donkerder: de middelste helft valt zo op.
  const shades = [0.22, 0.42, 0.68, 0.68, 0.42, 0.22];
  for (let i = 0; i < 6; i++) {
    bands += `<path d="${bandPath(WHO_Z[i].z, WHO_Z[i+1].z)}" fill="var(--line)" opacity="${shades[i]}"/>`;
  }
  let plines = "";
  WHO_Z.forEach(q => {
    const mid = q.p === 50;
    plines += `<path d="${linePath(q.z)}" fill="none" stroke="var(--ink-soft)" stroke-width="${mid?1.4:0.9}" opacity="${mid?0.75:0.4}"${mid?' stroke-dasharray="5 4"':''}/>`;
    if (q.p === 3 || q.p === 50 || q.p === 97) {
      const v = whoValue(kind, sex, maxDay, q.z);
      plines += `<text x="${(padL+innerW+4).toFixed(1)}" y="${(yFor(v)+3.5).toFixed(1)}" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">P${q.p}</text>`;
    }
  });

  // Y-ticks
  let grid = "";
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const y = padT + innerH - f*innerH, val = minV + f*(maxV-minV);
    grid += `<line x1="${padL}" x2="${padL+innerW}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" opacity="0.6"/>`;
    grid += `<text x="${padL-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">${kind==="gewicht"?(val/1000).toFixed(1):val.toFixed(dec)}</text>`;
  });

  // X-as in weken
  const wkStep = maxDay <= 84 ? 14 : maxDay <= 250 ? 28 : 91;
  let xlabels = "";
  for (let d = 0; d <= maxDay; d += wkStep) {
    xlabels += `<line x1="${xFor(d).toFixed(1)}" x2="${xFor(d).toFixed(1)}" y1="${padT}" y2="${padT+innerH}" stroke="var(--line)" stroke-width="1" opacity="0.5"/>`;
    xlabels += `<text x="${xFor(d).toFixed(1)}" y="${H-20}" text-anchor="middle" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">${d/7}</text>`;
  }
  xlabels += `<text x="${(padL+innerW/2).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">weken</text>`;
  const yUnit = `<text x="${padL-6}" y="${padT-4}" text-anchor="end" font-size="9.5" fill="var(--ink-soft)">${kind==="gewicht"?"kg":"cm"}</text>`;

  // De metingen
  let path = "", dots = "";
  points.forEach((p,i) => {
    const x = xFor(p.day), y = yFor(p.value);
    path += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1) + " ";
    const pc = whoPercentile(whoZScore(kind, sex, p.day, p.value));
    const last = i === points.length-1;
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${last?5:3.6}" fill="${color}" stroke="var(--surface)" stroke-width="1.5"><title>${shortDate(p.date)} · dag ${p.day} · ${p.value}${unit}${pc?" · P"+pc:""}</title></circle>`;
  });

  // Laatste punt labelen
  const L = points[points.length-1];
  const lx = xFor(L.day), ly = yFor(L.value);
  const anchor = lx > padL + innerW - 80 ? "end" : "start";
  const lbl = `<text x="${(lx + (anchor==="end"?-9:9)).toFixed(1)}" y="${(ly-9).toFixed(1)}" text-anchor="${anchor}" font-size="11.5" font-weight="700" font-family="IBM Plex Mono, monospace" fill="${color}">${kind==="gewicht"?L.value+" g":L.value.toFixed(1)+" cm"}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">
    ${bands}${grid}${plines}${xlabels}${yUnit}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    ${dots}${lbl}
  </svg>`;
}

// Lijngrafiek voor een groeireeks met datums op de X-as (all-time).
function growthChart(points, opts) {
  opts = opts || {};
  const unit = opts.unit || "";
  const color = opts.color || "var(--health)";
  const yPad = opts.pad != null ? opts.pad : 1;
  const dec = opts.dec != null ? opts.dec : 1;
  const refLines = opts.refLines || []; // [{value, label}]
  if (!points.length) return "";
  const W = 640, H = 220, padL = 52, padR = 12, padT = 16, padB = 40;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = points.length;
  const vals = points.map(p => p.value);
  // schaal bepalen; referentiewaarden meenemen zodat de lijnen zichtbaar zijn
  const refVals = refLines.map(r => r.value);
  let minV = Math.min(...vals, ...refVals) - yPad, maxV = Math.max(...vals, ...refVals) + yPad;
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const xFor = i => padL + (n === 1 ? innerW/2 : (i/(n-1))*innerW);
  const yFor = v => padT + innerH - ((v-minV)/(maxV-minV||1))*innerH;

  let path = "", dots = "";
  points.forEach((p,i) => {
    const x = xFor(i), y = yFor(p.value);
    path += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1) + " ";
    dots += `<circle cx="${x}" cy="${y}" r="4" fill="${color}"><title>${shortDate(p.date)} · ${p.value}${unit}</title></circle>`;
  });

  // Y-as
  let grid = "";
  [0,0.25,0.5,0.75,1].forEach(f => {
    const y = padT + innerH - f*innerH;
    const val = minV + f*(maxV-minV);
    grid += `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${y+3.5}" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">${val.toFixed(dec)}</text>`;
  });

  // Referentielijnen (bv. normale temperatuurband)
  let refs = "";
  refLines.forEach(r => {
    const y = yFor(r.value);
    refs += `<line x1="${padL}" x2="${W-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="5 4" opacity="0.6"/>`;
    refs += `<text x="${W-padR}" y="${(y-4).toFixed(1)}" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">${r.label}</text>`;
  });

  // X-as labels: eerste, midden, laatste (of alle als weinig punten)
  const idxs = n <= 5 ? points.map((_,i)=>i) : [0, Math.floor((n-1)/2), n-1];
  const xlabels = idxs.map(i => `<text x="${xFor(i)}" y="${H-20}" text-anchor="middle" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">${shortDate(points[i].date)}</text>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">
    ${grid}
    ${refs}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
    ${xlabels}
  </svg>`;
}

function renderGroeiView() {
  const gew = allMeasurements("gewicht");
  const len = allMeasurements("lengte");
  const temp = allMeasurements("temperatuur");

  const sex = getSex(), birth = getBirthDate();

  // Kaart voor gewicht of lengte: met WHO-percentielbanden zodra geboortedatum en
  // geslacht ingevuld zijn, anders de gewone lijngrafiek zoals voorheen.
  function measureCard(type, points, color, pad, dec) {
    if (!points.length) return "";
    const unit = type === "gewicht" ? " g" : " cm";
    const title = type === "gewicht" ? "Gewicht" : "Lengte";
    const last = points[points.length-1];
    const aged = points
      .map(pt => ({ date: pt.date, time: pt.time, value: pt.value, day: ageDays(pt.date) }))
      .filter(pt => pt.day !== null && pt.day >= 0 && pt.day <= 730);
    const useWHO = !!(sex && birth && aged.length);
    let extra = "";
    if (useWHO) {
      const l = aged[aged.length-1];
      const pc = whoPercentile(whoZScore(type, sex, l.day, l.value));
      if (pc !== null) extra += ` · <strong>percentiel ${pc}</strong>`;
      if (type === "gewicht") {
        const g = gainPerWeek(aged, 14);
        if (g) extra += ` · ${Math.round(g.perWeek)} g/week over ${g.days} dagen`;
      }
    }
    const chart = useWHO
      ? growthChartWHO(aged, { kind: type, sex: sex, color: color })
      : growthChart(points, { unit: unit, color: color, pad: pad, dec: dec });
    const hint = (!sex || !birth)
      ? `<div class="chart-sub" style="margin-top:9px">Vul geboortedatum en geslacht in bij Instellingen om de WHO-percentielen te tonen.</div>`
      : "";
    return `
    <div class="card">
      <div class="section-title">${title}</div>
      <div class="chart-sub">Alle metingen — ${points.length} meting${points.length===1?"":"en"} · laatst ${last.value}${unit}${extra}</div>
      ${chart}
      ${hint}
    </div>`;
  }

  const gewCard = measureCard("gewicht", gew, "var(--feed)", 150, 0);
  const lenCard = measureCard("lengte", len, "var(--sleep)", 1.5, 1);

  const tempCard = temp.length ? `
    <div class="card">
      <div class="section-title">Temperatuur</div>
      <div class="chart-sub">Alle metingen — ${temp.length} meting${temp.length===1?"":"en"} · laatst ${temp[temp.length-1].value} °C · normaal 36,5–37,5°</div>
      ${growthChart(temp, { unit:" °C", color:"var(--health)", pad:0.5, dec:1, refLines:[{value:37.5, label:"37,5°"},{value:36.5, label:"36,5°"}] })}
    </div>` : "";

  const body = (gewCard + lenCard + tempCard) || `
    <div class="card">
      <div class="empty-state">Nog geen gewicht-, lengte- of temperatuurmetingen. Voeg ze toe via ${'"'}+ Meting${'"'} op het Vandaag-scherm.</div>
    </div>`;

  return `
    <div class="groei-head">
      <div class="week-label" style="text-transform:none">Metingen</div>
      <div class="chart-sub">Gewicht, lengte en temperatuur over de volledige periode</div>
    </div>
    ${body}
    ${(sex && birth) ? `<div class="card" style="padding-top:14px">
      <div class="chart-sub" style="line-height:1.55">
        De grijze banden zijn de WHO-groeistandaard (2006) voor ${sex==="m"?"jongens":"meisjes"}: P3 onderaan tot P97 bovenaan,
        met de mediaan P50 gestippeld. Kind en Gezin werkt met de Vlaamse groeicurven — die liggen in de eerste maanden
        dicht hierbij, maar voor de officiele aflezing geldt de curve in het kindboekje.
        Lees de richting over weken, niet de losse punten: een gewicht schommelt makkelijk 100 g.
      </div>
    </div>` : ""}
  `;
}

function renderWeekView() {
  const dates = weekDates(state.selectedDate);
  const monday = dates[0], sunday = dates[6];
  const chartData = dates.map((d,i) => {
    const day = getDay(d);
    const totalMl = day.feedings.filter(f=>f.type==="fles").reduce((s,f)=>s+(Number(f.amount)||0),0);
    const borstFeeds = day.feedings.filter(f=>f.type==="borst");
    const borstL = borstFeeds.reduce((s,f)=>s+(Number(f.left)||0),0);
    const borstR = borstFeeds.reduce((s,f)=>s+(Number(f.right)||0),0);
    const borstMin = borstL + borstR;
    const plas = day.diapers.filter(x=>x.type==="plas").length;
    const poep = day.diapers.filter(x=>x.type==="poep").length;
    const beide = day.diapers.filter(x=>x.type==="beide").length;
    const temps = day.health.filter(h=>h.type==="temperatuur" && h.value !== "");
    const avgTemp = temps.length ? temps.reduce((s,t)=>s+Number(t.value),0)/temps.length : null;
    const gewMeas = day.health.filter(h=>h.type==="gewicht" && h.value!=="").map(h=>Number(h.value)).filter(v=>!isNaN(v));
    const lenMeas = day.health.filter(h=>h.type==="lengte" && h.value!=="").map(h=>Number(h.value)).filter(v=>!isNaN(v));
    const gewicht = gewMeas.length ? gewMeas[gewMeas.length-1] : null; // laatste meting van de dag
    const lengte = lenMeas.length ? lenMeas[lenMeas.length-1] : null;
    return {
      date: d, label: DAG_LABELS[i], ml: totalMl, borstMin, borstL, borstR,
      voedingen: day.feedings.length, plas, poep, beide, luiers: day.diapers.length,
      temp: avgTemp !== null ? Math.round(avgTemp*10)/10 : null,
      gewicht, lengte,
    };
  });

  const hasTemp = chartData.some(d => d.temp !== null);
  const totalFeedings = chartData.reduce((s,d)=>s+d.voedingen,0);
  const totalMlWeek = chartData.reduce((s,d)=>s+d.ml,0);
  const totalBorstMinWeek = chartData.reduce((s,d)=>s+d.borstMin,0);
  const totalBorstLWeek = chartData.reduce((s,d)=>s+d.borstL,0);
  const totalBorstRWeek = chartData.reduce((s,d)=>s+d.borstR,0);
  const totalDiapers = chartData.reduce((s,d)=>s+d.luiers,0);
  const daysWithData = chartData.filter(d=>d.voedingen>0||d.luiers>0).length || 1;
  const hasBorst = chartData.some(d => d.borstMin > 0);
  const hasFles = chartData.some(d => d.ml > 0);
  const hasGewicht = chartData.some(d => d.gewicht !== null);
  const hasLengte = chartData.some(d => d.lengte !== null);

  return `
    <div class="week-nav">
      <button class="nav-btn" data-action="week-prev">${ICON.chevronLeft}</button>
      <div class="week-label">${formatDateNice(monday).split(" ").slice(1).join(" ")} — ${formatDateNice(sunday)}</div>
      <button class="nav-btn" data-action="week-next">${ICON.chevronRight}</button>
    </div>

    <div class="week-summary">
      <div class="summary-card"><div class="num mono">${totalFeedings}</div><div class="lbl">voedingen</div></div>
      <div class="summary-card"><div class="num mono">${fmtDuration(totalBorstMinWeek)}</div><div class="lbl">borst totaal</div>${totalBorstMinWeek ? `<div class="sub">L ${fmtDuration(totalBorstLWeek)} · R ${fmtDuration(totalBorstRWeek)}</div>` : ""}</div>
      <div class="summary-card"><div class="num mono">${totalMlWeek} ml</div><div class="lbl">fles totaal</div></div>
      <div class="summary-card"><div class="num mono">${totalDiapers}</div><div class="lbl">luiers</div></div>
    </div>

    ${hasBorst ? `
    <div class="card">
      <div class="section-title">Borstvoeding per dag (minuten)</div>
      <div class="chart-sub">Totale tijd aan de borst per dag deze week</div>
      ${barChart(chartData, [{key:"borstMin", color:"var(--feed)"}], v => v + " min")}
    </div>` : ""}

    ${hasFles ? `
    <div class="card">
      <div class="section-title">Flesvoeding per dag (ml)</div>
      <div class="chart-sub">Totale hoeveelheid melk per fles per dag deze week</div>
      ${barChart(chartData, [{key:"ml", color:"var(--feed)"}], v => v + " ml")}
    </div>` : ""}

    <div class="card">
      <div class="section-title">Luiers per dag</div>
      <div class="chart-sub">Pipi, kaka en gecombineerde luiers per dag</div>
      ${barChart(chartData, [{key:"plas", color:"var(--diaper)", label:"Pipi"},{key:"poep", color:"var(--diaper-dark)", label:"Kaka"},{key:"beide", color:"var(--health)", label:"Pipi + kaka"}], v => v)}
      <div class="legend">
        <span><i style="background:var(--diaper)"></i>Pipi</span>
        <span><i style="background:var(--diaper-dark)"></i>Kaka</span>
        <span><i style="background:var(--health)"></i>Pipi + kaka</span>
      </div>
    </div>

    ${hasTemp ? `
    <div class="card">
      <div class="section-title">Temperatuur</div>
      <div class="chart-sub">Gemiddelde gemeten temperatuur per dag (°C)</div>
      ${lineChart(chartData, {key:"temp", unit:"°C", dec:1})}
    </div>` : ""}

    ${hasGewicht ? `
    <div class="card">
      <div class="section-title">Gewicht</div>
      <div class="chart-sub">Gemeten gewicht per dag (gram)</div>
      ${lineChart(chartData, {key:"gewicht", unit:" g", pad:100, dec:0})}
    </div>` : ""}

    ${hasLengte ? `
    <div class="card">
      <div class="section-title">Lengte</div>
      <div class="chart-sub">Gemeten lengte per dag (cm)</div>
      ${lineChart(chartData, {key:"lengte", unit:" cm", pad:1, dec:1})}
    </div>` : ""}

    ${(() => {
      const others = [];
      dates.forEach((d,i) => getDay(d).health.filter(h=>!HEALTH_NUM[h.type]).forEach(h => others.push({ date:d, label:DAG_LABELS[i], time:h.time||"", type:h.type, value:h.value||"", note:h.note||"" })));
      if (!others.length) return "";
      return `
      <div class="card">
        <div class="section-title">Andere metingen</div>
        <div class="chart-sub">Gedrag en overige metingen deze week</div>
        <div class="sum-list">
          ${others.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(h => `
            <div class="sum-row">
              <span class="sum-time mono">${h.label}${h.time ? " " + h.time : ""}</span>
              <span class="sum-dot" style="background:var(--health)"></span>
              <span class="sum-text">${HEALTH_LABEL[h.type] || h.type}${h.value ? " · " + escapeHtml(h.value) : ""}${h.note ? " · " + escapeHtml(h.note) : ""}</span>
            </div>`).join("")}
        </div>
      </div>`;
    })()}
  `;
}

function renderReportView() {
  const { from, to, preset } = state.report;
  const dates = datesBetween(from, to);
  const agg = aggregate(dates);
  const daysData = agg.perDay.filter(d => d.feedings>0||d.luiers>0||d.temps.length>0).length;
  const denom = daysData || 1;
  const tMin = agg.temps.length ? Math.min(...agg.temps) : null;
  const tMax = agg.temps.length ? Math.max(...agg.temps) : null;
  const tAvg = agg.temps.length ? avg(agg.temps) : null;
  // laatste gewicht/lengte in de periode (chronologisch)
  let lastGewicht = null, lastLengte = null;
  dates.forEach(d => getDay(d).health.forEach(h => {
    if (h.type === "gewicht" && h.value !== "" && !isNaN(Number(h.value))) lastGewicht = Number(h.value);
    if (h.type === "lengte" && h.value !== "" && !isNaN(Number(h.value))) lastLengte = Number(h.value);
  }));
  const periodLabel = from === to ? formatDateNice(from) : `${longDate(from)} – ${longDate(to)}`;
  const presets = [["dag","Dag"],["week","Week"],["maand","Maand"],["aangepast","Aangepast"]];
  const cat = state.report.cat || "alles";
  const cats = [["alles","Alles"],["voeding","Voeding"],["luiers","Luiers"],["gezondheid","Gezondheid"],["notities","Notities"]];

  return `
    <div class="report-controls">
      <div class="preset-row">
        ${presets.map(([p,l])=>`<button class="preset-btn ${preset===p?'active':''}" data-action="report-preset" data-preset="${p}">${l}</button>`).join("")}
      </div>
      <div class="date-inputs">
        <div class="field"><label>Van</label><input type="date" data-action="report-from" value="${from}"></div>
        <div class="field"><label>Tot</label><input type="date" data-action="report-to" value="${to}"></div>
      </div>
      <div class="preset-row cat-row">
        ${cats.map(([c,l])=>`<button class="preset-btn ${cat===c?'active':''}" data-action="report-cat" data-cat="${c}">${l}</button>`).join("")}
      </div>
    </div>

    ${cat === "alles" ? renderReportAll(dates, agg, denom, daysData, tMin, tMax, tAvg, lastGewicht, lastLengte, periodLabel) : renderReportCategory(cat, dates, periodLabel, daysData)}
  `;
}

// Volledig rapport (alle categorieën) — de bestaande samenvatting + tabel + notities.
function renderReportAll(dates, agg, denom, daysData, tMin, tMax, tAvg, lastGewicht, lastLengte, periodLabel) {
  const from = state.report.from, to = state.report.to;
  return `
    <div class="card">
      <div class="report-head">
        <div class="report-period">${periodLabel}</div>
        <div class="report-meta">${dates.length} ${dates.length===1?'dag':'dagen'} · ${daysData} met registraties · opgesteld ${formatDateNice(todayStr())}</div>
      </div>

      <div class="report-summary">
        <div class="rep-block" style="border-left-color:var(--feed)">

// Gedetailleerd rapport voor één categorie, per dag gegroepeerd (incl. notities).
function renderReportCategory(cat, dates, periodLabel, daysData) {
  const titleMap = { voeding:"Voeding", luiers:"Luiers", gezondheid:"Gezondheid", notities:"Notities" };
  const colorMap = { voeding:"var(--feed)", luiers:"var(--diaper)", gezondheid:"var(--health)", notities:"var(--note)" };
  const title = titleMap[cat] || "Rapport";
  const color = colorMap[cat] || "var(--ink)";

  // Bouwt de rijen (tijd + tekst) voor één dag en categorie.
  function rowsFor(day) {
    let items = [];
    if (cat === "voeding") {
      items = day.feedings.map(e => ({
        time: e.time || "",
        text: (e.type === "borst"
          ? `Borst · L ${fmtDuration(Number(e.left)||0)} · R ${fmtDuration(Number(e.right)||0)}${e.side ? " · laatst " + (e.side==="links"?"L":"R") : ""}`
          : `Fles · ${e.amount} ml`),
        note: e.note || "",
      }));
    } else if (cat === "luiers") {
      items = day.diapers.map(e => ({ time: e.time || "", text: DIAPER_LABEL[e.type] || "Luier", note: e.note || "" }));
    } else if (cat === "notities") {
      items = (day.notes || []).map(e => ({ time: e.time || "", text: "Notitie", note: e.note || "" }));
    } else if (cat === "gezondheid") {
      items = day.health.map(e => ({
        time: e.time || "",
        text: HEALTH_NUM[e.type] ? `${HEALTH_LABEL[e.type]} · ${e.value}${HEALTH_NUM[e.type].unit}` : `${HEALTH_LABEL[e.type]}${e.value ? " · " + escapeHtml(e.value) : ""}`,
        note: e.note || "",
      }));
    }
    items.sort((a,b)=>timeToMinutes(a.time||"0:0")-timeToMinutes(b.time||"0:0"));
    return items;
  }

  // Tel totaal aantal registraties in de periode
  let total = 0;
  const blocks = dates.map((d,i) => {
    const items = rowsFor(getDay(d));
    if (!items.length) return "";
    total += items.length;
    return `
      <div class="rep-day">
        <div class="rep-day-head">${formatDateNice(d)}</div>
        <div class="sum-list">
          ${items.map(it => `
            <div class="sum-row">
              <span class="sum-time mono">${it.time || "–"}</span>
              <span class="sum-dot" style="background:${color}"></span>
              <span class="sum-text">${it.text}${it.note ? ` <span class="rep-note">— ${escapeHtml(it.note)}</span>` : ""}</span>
            </div>`).join("")}
        </div>
      </div>`;
  }).join("");

  const body = total ? blocks : `<div class="empty-state">Geen ${title.toLowerCase()}-registraties in deze periode.</div>`;

  return `
    <div class="card">
      <div class="report-head">
        <div class="report-period">${title} — ${periodLabel}</div>
        <div class="report-meta">${total} registratie${total===1?"":"s"} · ${dates.length} ${dates.length===1?'dag':'dagen'} · opgesteld ${formatDateNice(todayStr())}</div>
      </div>
      ${body}
    </div>

    <div class="report-actions">
      <button class="report-btn-primary" data-action="report-print">${ICON.printer} Opslaan als PDF</button>
      <button data-action="report-csv">${ICON.download} Exporteer voor Excel</button>
    </div>
  `;
}

// simple hand-rolled SVG stacked/grouped bar chart
function niceMax(v) {
  // rond het maximum af naar een net getal voor de Y-as
  if (v <= 1) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / pow;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return step * pow;
}
function barChart(data, series, fmt, opts) {
  opts = opts || {};
  const W = 640, H = 200, padL = 46, padR = 10, padT = 12, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = data.length;
  const gap = 14;
  const bw = (innerW - gap*(n-1)) / n;
  const rawMax = Math.max(1, ...data.map(d => series.reduce((s,ser)=>s+(d[ser.key]||0),0)));
  const maxVal = niceMax(rawMax);
  // aantal segmenten: deel op hele stappen zodat labels niet dubbel afronden
  let yTicks = 4;
  if (maxVal <= 5) yTicks = maxVal;                    // kleine schaal: 1 per stap
  else if (maxVal % 4 !== 0) yTicks = (maxVal % 5 === 0) ? 5 : (maxVal % 3 === 0 ? 3 : 4);
  const axisFmt = opts.axisFmt || (v => v);

  // gridlijnen + Y-as-labels
  let grid = "";
  for (let t = 0; t <= yTicks; t++) {
    const f = t / yTicks;
    const y = padT + innerH - f*innerH;
    const val = Math.round(maxVal * f);
    grid += `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${y+3.5}" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">${escapeHtml(String(axisFmt(val)))}</text>`;
  }

  let bars = "";
  data.forEach((d, i) => {
    const x = padL + i*(bw+gap);
    let yOffset = 0;
    series.forEach(ser => {
      const val = d[ser.key] || 0;
      const h = (val/maxVal) * innerH;
      const y = padT + innerH - yOffset - h;
      if (val > 0) {
        const segLabel = ser.label ? ser.label + ": " : "";
        bars += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1.5)}" fill="${ser.color}" rx="3">
          <title>${d.label} · ${segLabel}${escapeHtml(String(fmt(val)))}</title>
        </rect>`;
      }
      yOffset += h;
    });
    bars += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">${grid}${bars}</svg>`;
}

function lineChart(data, opts) {
  opts = opts || {};
  const key = opts.key || "temp";
  const unit = opts.unit || "°C";
  const color = opts.color || "var(--health)";
  const yPad = opts.pad != null ? opts.pad : 0.5;
  const dec = opts.dec != null ? opts.dec : 1;
  const W = 640, H = 180, padL = 46, padR = 10, padT = 16, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = data.length;
  const pts = data.map((d,i)=>({ label: d.label, v: d[key], x: padL + (i/(Math.max(n-1,1)))*innerW }));
  const vals = pts.filter(p=>p.v!==null && p.v!==undefined).map(p=>p.v);
  if (!vals.length) return "";
  let minV = Math.min(...vals) - yPad, maxV = Math.max(...vals) + yPad;
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const yFor = v => padT + innerH - ((v-minV)/(maxV-minV||1))*innerH;

  let path = "", dots = "", started = false;
  pts.forEach(p => {
    if (p.v === null || p.v === undefined) return;
    const y = yFor(p.v);
    path += (started ? "L" : "M") + p.x.toFixed(1) + "," + y.toFixed(1) + " ";
    started = true;
    dots += `<circle cx="${p.x}" cy="${y}" r="4" fill="${color}"><title>${p.label} · ${p.v}${unit}</title></circle>`;
  });

  const labels = pts.map(p => `<text x="${p.x}" y="${H-6}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">${p.label}</text>`).join("");
  let grid = "";
  [0,0.5,1].forEach(f => {
    const y = padT + innerH - f*innerH;
    const val = minV + f*(maxV-minV);
    grid += `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${y+3.5}" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">${val.toFixed(dec)}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">
    ${grid}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}

// ---- borstvoeding timer ----
function timerElapsedSec(side) {
  const t = state.breastTimer[side];
  if (!t.running) return 0;
  return Math.floor((Date.now() - t.startedAt) / 1000);
}
function timerDisplay(side) {
  const sec = timerElapsedSec(side);
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${pad(m)}:${pad(s)}`;
}
function tickBreastTimers() {
  ["left","right"].forEach(side => {
    if (!state.breastTimer[side].running) return;
    const disp = document.getElementById("timer-disp-" + side);
    if (disp) disp.textContent = timerDisplay(side);
  });
}
function resetBreastTimers() {
  state.breastTimer.left = { running: false, startedAt: 0 };
  state.breastTimer.right = { running: false, startedAt: 0 };
}
setInterval(tickBreastTimers, 1000);

// Werkt de schepjes-hint bij op basis van het ml-veld (1 schepje per 30 ml water)
function updateScoopsHint() {
  const hint = document.getElementById("f-scoops");
  const amtInput = document.getElementById("f-amount");
  const milk = (document.getElementById("f-milk") || {}).value;
  if (!hint || !amtInput || milk !== "poeder") return;
  const ml = Number(amtInput.value) || 0;
  if (ml <= 0) { hint.textContent = "1 schepje poeder per 30 ml water"; return; }
  const scoops = Math.round(ml / 30);
  const rest = ml % 30;
  hint.textContent = `≈ ${scoops} schepje${scoops===1?"":"s"} poeder (1 per 30 ml)` + (rest ? " — gebruik een veelvoud van 30 ml" : "");
}

// ---------------- event handling ----------------
function attachHandlers() {
  root.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener(el.tagName === "INPUT" ? "change" : "click", onAction);
  });
  const amt = document.getElementById("f-amount");
  if (amt) amt.addEventListener("input", updateScoopsHint);
}

function onAction(ev) {
  const el = ev.currentTarget;
  const action = el.dataset.action;

  if (action === "tab") {
    state.activeTab = el.dataset.tab;
    if (el.dataset.tab === "dag") state.selectedDate = todayStr();
    render(); syncCurrentView();
  }
  else if (action === "day-prev") { state.selectedDate = addDays(state.selectedDate, -1); render(); syncCurrentView(); }
  else if (action === "day-next") {
    const next = addDays(state.selectedDate, 1);
    if (next <= todayStr()) { state.selectedDate = next; render(); syncCurrentView(); }
  }
  else if (action === "day-today") { state.selectedDate = todayStr(); render(); }
  else if (action === "week-prev") { state.selectedDate = addDays(state.selectedDate, -7); render(); syncCurrentView(); }
  else if (action === "week-next") { state.selectedDate = addDays(state.selectedDate, 7); render(); syncCurrentView(); }
  else if (action === "report-preset") {
    const p = el.dataset.preset;
    state.report.preset = p;
    const ref = state.report.from || todayStr();
    if (p === "dag") { state.report.from = ref; state.report.to = ref; }
    else if (p === "week") { state.report.from = mondayOf(ref); state.report.to = addDays(mondayOf(ref), 6); }
    else if (p === "maand") { const [f,t] = monthRange(ref); state.report.from = f; state.report.to = t; }
    render(); syncCurrentView();
  }
  else if (action === "report-cat") {
    state.report.cat = el.dataset.cat;
    render();
  }
  else if (action === "report-from") { state.report.from = el.value || todayStr(); state.report.preset = "aangepast"; render(); syncCurrentView(); }
  else if (action === "report-to") { state.report.to = el.value || todayStr(); state.report.preset = "aangepast"; render(); syncCurrentView(); }
  else if (action === "report-print") {
    // korte vertraging zodat de render zeker klaar is voor de printdialoog opent
    setTimeout(() => { try { window.print(); } catch (e) { alert("Afdrukken lukte niet. Gebruik het menu van je browser (⋮) → Afdrukken → Opslaan als PDF."); } }, 100);
  }
  else if (action === "report-csv") { exportReportCsv(); }
  else if (action === "sync-connect") {
    const val = document.getElementById("sync-code-input").value.trim().toLowerCase().replace(/\s+/g, "-");
    if (!val) return;
    SYNC.code = val; localStorage.setItem("babyritme:family", val);
    SYNC.enabled = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
    state.modal = null; render();
    if (SYNC.enabled) {
      setStatus("syncing");
      reconcileAppName()
        .then(() => reconcileBirthDate())
        .then(() => reconcileAppointments())
        .then(() => uploadAllLocal())
        .then(() => syncCurrentView())
        .catch(() => setStatus("offline"));
    }
  }
  else if (action === "sync-disconnect") {
    SYNC.code = null; SYNC.enabled = false;
    localStorage.removeItem("babyritme:family");
    setStatus("off"); state.modal = null; render();
  }
  else if (action === "sync-resync") { syncCurrentView(); }
  else if (action === "open-modal") { state.editEntry = null; state.editAppt = null; state.modal = el.dataset.modal; render(); }
  else if (action === "toggle-checklist") {
    toggleChecklistItem(state.selectedDate, el.dataset.id);
    render();
  }
  else if (action === "close-modal") { resetBreastTimers(); state.editEntry = null; state.editAppt = null; state.modal = null; render(); }
  else if (action === "edit-entry") {
    const kind = el.dataset.kind, id = el.dataset.id;
    const day = getDay(state.selectedDate);
    const entry = (day[kind] || []).find(e => e.id === id);
    if (!entry) return;
    state.editEntry = { ...entry, kind };
    state.modal = kind === "feedings" ? "voeding" : kind === "diapers" ? "luier" : kind === "notes" ? "notitie" : "meting";
    render();
  }
  else if (action === "delete-entry") {
    const day = getDay(state.selectedDate);
    day[el.dataset.kind] = day[el.dataset.kind].filter(e => e.id !== el.dataset.id);
    persistDay(state.selectedDate);
    queueDelete(el.dataset.id);
    render();
  }
  else if (action === "goto-entry") {
    const target = document.getElementById("entry-" + el.dataset.id);
    if (target) {
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      target.classList.remove("entry-flash");
      void target.offsetWidth; // reset animatie
      target.classList.add("entry-flash");
    }
  }
  else if (action === "day-summary") {
    state.summaryCat = el.dataset.cat;
    state.modal = "samenvatting";
    render();
  }
  else if (action === "edit-appt") {
    const a = state.appointments.find(x => x.id === el.dataset.id);
    if (!a) return;
    state.editAppt = { ...a };
    state.modal = "afspraak";
    render();
  }
  else if (action === "delete-appt") {
    state.appointments = state.appointments.filter(a => a.id !== el.dataset.id);
    saveAppointments(state.appointments);
    queueDelete(el.dataset.id);
    render();
  }
  else if (action === "save-afspraak") {
    const ed = state.editAppt;
    const title = document.getElementById("a-title").value.trim();
    const date = document.getElementById("a-date").value || todayStr();
    const time = document.getElementById("a-time").value || "";
    const note = document.getElementById("a-note").value.trim();
    if (!title) { document.getElementById("a-title").focus(); return; }
    const appt = { id: ed ? ed.id : uid(), title, date, time, note };
    if (ed) {
      const i = state.appointments.findIndex(a => a.id === ed.id);
      if (i >= 0) state.appointments[i] = appt; else state.appointments.push(appt);
    } else {
      state.appointments.push(appt);
    }
    saveAppointments(state.appointments);
    queueAppointment(appt);
    state.editAppt = null; state.modal = null; render();
  }
  else if (action === "reminder-preset") {
    const min = Number(el.dataset.min) || 180;
    document.getElementById("r-hours").value = Math.floor(min / 60);
    document.getElementById("r-mins").value = min % 60;
    el.parentElement.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("on"));
    el.classList.add("on");
  }
  else if (action === "save-reminder") {
    const enabled = document.getElementById("r-enabled").value === "aan";
    const h = Math.max(0, Number(document.getElementById("r-hours").value) || 0);
    const m = Math.max(0, Number(document.getElementById("r-mins").value) || 0);
    let intervalMin = h * 60 + m;
    if (intervalMin < 5) intervalMin = 5; // ondergrens
    setReminderCfg({ enabled, intervalMin });
    state.modal = null; render();
  }
  else if (action === "save-instellingen") {
    const newName = document.getElementById("app-name-input").value;
    setAppName(newName);
    applyAppName();
    queueAppName(getAppName());
    const birth = document.getElementById("birth-input").value;
    const ts = Date.now();
    setBirthDate(birth, ts);
    queueBirthDate(getBirthDate() || "", ts);
    const sexEl = document.getElementById("sex-input");
    if (sexEl) setSex(sexEl.value);
    state.modal = null; render();
  }
  else if (action === "breast-timer") {
    const side = el.dataset.side; // "left" of "right"
    const t = state.breastTimer[side];
    const input = document.getElementById(side === "left" ? "f-left" : "f-right");
    const btn = document.getElementById("timer-btn-" + side);
    const disp = document.getElementById("timer-disp-" + side);
    if (!t.running) {
      // start
      t.running = true; t.startedAt = Date.now();
      if (btn) { btn.textContent = "Stop"; btn.classList.add("running"); }
    } else {
      // stop -> tel afgeronde minuten op bij het veld (min. 1 min als er iets geteld is)
      const sec = timerElapsedSec(side);
      t.running = false; t.startedAt = 0;
      let mins = Math.round(sec / 60);
      if (sec > 0 && mins === 0) mins = 1;
      if (input) input.value = (Number(input.value) || 0) + mins;
      if (btn) { btn.textContent = "Start"; btn.classList.remove("running"); }
      if (disp) disp.textContent = "00:00";
      // zet de laatste kant automatisch op deze kant
      const sideNl = side === "left" ? "links" : "rechts";
      const hidden = document.getElementById("f-side"); if (hidden) hidden.value = sideNl;
      document.querySelectorAll("[data-group='f-side']").forEach(b => {
        const on = b.dataset.value === sideNl;
        b.classList.toggle("on", on);
        b.style.background = on ? "var(--feed)" : "";
      });
    }
  }
  else if (action === "seg") {
    const group = el.dataset.group, value = el.dataset.value;
    document.getElementById(group).value = value;
    el.parentElement.querySelectorAll("button").forEach(b => {
      b.classList.remove("on"); b.style.background = "";
    });
    el.classList.add("on");
    el.style.background = getComputedStyle(document.documentElement).getPropertyValue(
      group === "f-type" ? "--feed" : group === "d-type" ? "--diaper" : "--health"
    ) || el.style.background;
    // keep original inline color var reference instead (simpler + correct):
    el.style.background = (group === "f-milk" || group === "f-side" || group === "r-enabled") ? "var(--feed)" : group === "d-type" ? "var(--diaper)" : "var(--health)";
    if (group === "f-milk") {
      const label = document.getElementById("f-amount-label");
      const hint = document.getElementById("f-scoops");
      const amtInput = document.getElementById("f-amount");
      if (value === "poeder") {
        if (label) label.textContent = "Hoeveelheid water (ml)";
        if (amtInput) amtInput.step = "30";
        if (hint) { hint.style.display = ""; updateScoopsHint(); }
      } else {
        if (label) label.textContent = "Hoeveelheid (ml)";
        if (amtInput) amtInput.removeAttribute("step");
        if (hint) hint.style.display = "none";
      }
    }
    if (group === "h-type") {
      const label = document.getElementById("h-value-label");
      const valueInput = document.getElementById("h-value");
      const num = HEALTH_NUM[value];
      if (num) {
        label.textContent = num.label;
        valueInput.type = "number"; valueInput.step = num.step; valueInput.placeholder = num.ph;
      } else {
        label.textContent = value === "gedrag" ? "Beschrijving" : "Waarde";
        valueInput.type = "text"; valueInput.removeAttribute("step"); valueInput.placeholder = "bv. onrustig, veel huilen";
      }
    }
  }
  else if (action === "save-feeding") {
    const ed = state.editEntry;
    const type = document.getElementById("f-type").value;
    const time = document.getElementById("f-time").value || nowTimeStr();
    if (isFuture(state.selectedDate, time)) { showModalError("Je kunt geen voeding in de toekomst registreren."); return; }
    let entry;
    if (type === "borst") {
      const left = Number(document.getElementById("f-left").value) || 0;
      const right = Number(document.getElementById("f-right").value) || 0;
      if (left <= 0 && right <= 0) {
        showModalError("Vul minstens links of rechts in (meer dan 0 minuten).");
        document.getElementById("f-left").focus();
        return;
      }
      const side = document.getElementById("f-side").value;
      entry = {
        id: ed ? ed.id : uid(), time, type, left, right, side,
        note: document.getElementById("f-note").value.trim(),
      };
      setLastBreastSide(side, time, state.selectedDate);
    } else {
      const amount = Number(document.getElementById("f-amount").value) || 0;
      const milk = (document.getElementById("f-milk") || {}).value || "poeder";
      if (amount <= 0) {
        showModalError("Vul een hoeveelheid in (meer dan 0 ml).");
        document.getElementById("f-amount").focus();
        return;
      }
      if (milk === "poeder" && amount % 30 !== 0) {
        showModalError("Bij poedermelk moet de hoeveelheid water een veelvoud van 30 ml zijn.");
        document.getElementById("f-amount").focus();
        return;
      }
      entry = {
        id: ed ? ed.id : uid(), time, type: "fles", milk, amount,
        note: document.getElementById("f-note").value.trim(),
      };
    }
    const day = getDay(state.selectedDate);
    if (ed) {
      const i = day.feedings.findIndex(e => e.id === ed.id);
      if (i >= 0) day.feedings[i] = entry; else day.feedings.push(entry);
    } else {
      day.feedings.push(entry);
    }
    persistDay(state.selectedDate, { kind: "feedings", entry });
    resetBreastTimers();
    state.editEntry = null; state.modal = null; render();
    if (partyActive()) showFireworks("Proficiat! 7 weken borstvoeding 🎉");
  }
  else if (action === "save-note") {
    const ed = state.editEntry;
    const entry = {
      id: ed ? ed.id : uid(),
      time: document.getElementById("n-time").value || nowTimeStr(),
      note: document.getElementById("n-note").value.trim(),
    };
    if (!entry.note) { showModalError("Schrijf eerst iets in de notitie."); return; }
    if (isFuture(state.selectedDate, entry.time)) { showModalError("Je kunt geen notitie in de toekomst registreren."); return; }
    const day = getDay(state.selectedDate);
    if (ed) {
      const i = day.notes.findIndex(e => e.id === ed.id);
      if (i >= 0) day.notes[i] = entry; else day.notes.push(entry);
    } else {
      day.notes.push(entry);
    }
    persistDay(state.selectedDate, { kind: "notes", entry });
    state.editEntry = null; state.modal = null; render();
  }
  else if (action === "save-diaper") {
    const ed = state.editEntry;
    const entry = {
      id: ed ? ed.id : uid(),
      time: document.getElementById("d-time").value || nowTimeStr(),
      type: document.getElementById("d-type").value,
      note: document.getElementById("d-note").value.trim(),
    };
    if (isFuture(state.selectedDate, entry.time)) { showModalError("Je kunt geen luier in de toekomst registreren."); return; }
    const day = getDay(state.selectedDate);
    if (ed) {
      const i = day.diapers.findIndex(e => e.id === ed.id);
      if (i >= 0) day.diapers[i] = entry; else day.diapers.push(entry);
    } else {
      day.diapers.push(entry);
    }
    persistDay(state.selectedDate, { kind: "diapers", entry });
    state.editEntry = null; state.modal = null; render();
  }
  else if (action === "save-health") {
    const ed = state.editEntry;
    const entry = {
      id: ed ? ed.id : uid(),
      time: document.getElementById("h-time").value || nowTimeStr(),
      type: document.getElementById("h-type").value,
      value: document.getElementById("h-value").value.trim(),
      note: document.getElementById("h-note").value.trim(),
    };
    if (isFuture(state.selectedDate, entry.time)) { showModalError("Je kunt geen meting in de toekomst registreren."); return; }
    const day = getDay(state.selectedDate);
    if (ed) {
      const i = day.health.findIndex(e => e.id === ed.id);
      if (i >= 0) day.health[i] = entry; else day.health.push(entry);
    } else {
      day.health.push(entry);
    }
    persistDay(state.selectedDate, { kind: "health", entry });
    state.editEntry = null; state.modal = null; render();
  }
}

// ---------------- PWA manifest + documenttitel (naam is instelbaar) ----------------
let _manifestUrl = null;
function applyAppName() {
  const name = getAppName();
  // Documenttitel bijwerken
  document.title = `${name} — voeding & luiers bijhouden`;
  const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (appleTitle) appleTitle.content = name;
  // Manifest (opnieuw) genereren via Blob
  const icon = (size) => "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" rx="${Math.round(size*0.22)}" fill="#7C9473"/><text x="50%" y="66%" font-size="${Math.round(size*0.5)}" text-anchor="middle" fill="white" font-family="sans-serif">🍼</text></svg>`
  );
  const manifest = {
    name, short_name: name, start_url: ".", display: "standalone",
    background_color: "#F1EEE2", theme_color: "#7C9473",
    icons: [
      { src: icon(192), sizes: "192x192", type: "image/svg+xml" },
      { src: icon(512), sizes: "512x512", type: "image/svg+xml" },
    ],
  };
  try {
    if (_manifestUrl) URL.revokeObjectURL(_manifestUrl);
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    _manifestUrl = URL.createObjectURL(blob);
    let link = document.querySelector('link[rel="manifest"]');
    if (!link) { link = document.createElement("link"); link.rel = "manifest"; document.head.appendChild(link); }
    link.href = _manifestUrl;
  } catch (e) { /* manifest optioneel */ }
}

applyAppName();
state.appointments = loadAppointments();
initSync();
migreerAndersNaarNotitie();
render();
if (SYNC.enabled) {
  syncCurrentView();
  setInterval(() => { if (!state.modal) syncCurrentView(); }, 20000);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && SYNC.enabled && !state.modal) syncCurrentView();
});
</script>
